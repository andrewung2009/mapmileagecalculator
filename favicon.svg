<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">Delivery Planner route pin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233b"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#4fe3f7"/>
      <stop offset="0.5" stop-color="#00a8cc"/>
      <stop offset="1" stop-color="#00749b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.58" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#00a8cc" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00a8cc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- planned route, ending at the destination pin -->
  <path d="M74 448 C74 372 140 326 220 320 C246 318 260 312 268 300"
        fill="none" stroke="#dff6fc" stroke-width="23" stroke-linecap="round"/>
  <circle cx="74" cy="448" r="27" fill="none" stroke="#dff6fc" stroke-width="14"/>

  <!-- destination pin -->
  <path d="M264 414 C264 414 164 300 164 196 A100 100 0 1 1 364 196 C364 300 264 414 264 414 Z"
        fill="url(#pin)"/>
  <circle cx="264" cy="196" r="38" fill="#0f172a"/>
</svg>
